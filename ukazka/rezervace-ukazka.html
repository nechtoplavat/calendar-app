<title>ADent. rezervace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Crimson+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: jeden sloupec s přepínačem Pacient / Ordinace; barvy a písma převzaté z adentdh.com */
:root {
  --bg: #FBF8F3; --paper: #FFFFFF; --text: #332622; --muted: #6b5a50; --line: #ead9cc;
  --accent: #71563F; --peach: #FDD2B9; --peach-soft: #fdebe0; --cream: #F6F1EB;
  --btn-bg: #332622; --btn-text: #F6F1EB;
  --good: #2f7a4f; --good-bg: #e8f4ec; --bad: #a33b2b; --bad-bg: #f8e6e2; --block: #efe7de;
  --f-d: "Lora", Georgia, serif; --f-t: "Crimson Pro", Georgia, serif;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px;
  --c1: #FDD2B9; --c2: #d5e8d4; --c3: #d3e3f1; --c4: #e3d9f0; --c5: #f3e3b5; --c6: #f6d0d6; --c7: #cdebe6; --c8: #e8e1d9;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #2b201d; --paper: #352823; --text: #F6F1EB; --muted: #cdbfb3; --line: #4a3a33;
  --accent: #e7b896; --peach: #8a5a42; --peach-soft: #47342c; --cream: #3d2e28;
  --btn-bg: #F6F1EB; --btn-text: #332622;
  --good: #8fd1a8; --good-bg: #24382c; --bad: #f0a093; --bad-bg: #4a2a24; --block: #3f312b;
  --c1: #7a4e3a; --c2: #34503a; --c3: #2f4558; --c4: #47395a; --c5: #5a4c2a; --c6: #5e3540; --c7: #2c524c; --c8: #4a3e37;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #2b201d; --paper: #352823; --text: #F6F1EB; --muted: #cdbfb3; --line: #4a3a33;
  --accent: #e7b896; --peach: #8a5a42; --peach-soft: #47342c; --cream: #3d2e28;
  --btn-bg: #F6F1EB; --btn-text: #332622;
  --good: #8fd1a8; --good-bg: #24382c; --bad: #f0a093; --bad-bg: #4a2a24; --block: #3f312b;
  --c1: #7a4e3a; --c2: #34503a; --c3: #2f4558; --c4: #47395a; --c5: #5a4c2a; --c6: #5e3540; --c7: #2c524c; --c8: #4a3e37;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--text); font-family: var(--f-t); font-size: 18px; line-height: 1.45; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 18px 16px 60px; }
h1, h2, h3 { font-family: var(--f-d); font-weight: 500; text-wrap: balance; margin: 0; }
h2 { font-size: 26px; } h3 { font-size: 19px; }
.ui { font-family: var(--f-ui); font-size: 14px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Hlavička */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.brand { font-family: var(--f-d); font-size: 28px; letter-spacing: -.01em; }
.brand span { color: var(--accent); }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-family: var(--f-ui); font-size: 14px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-text); }
.demo-note { font-family: var(--f-ui); font-size: 13px; background: var(--peach-soft); border-radius: 12px; padding: 9px 12px; margin-bottom: 18px; display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; padding: 0; text-decoration: underline; cursor: pointer; color: var(--accent); font-family: var(--f-ui); font-size: 13px; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-text); padding: 11px 22px; border-radius: 999px; cursor: pointer; font-family: var(--f-ui); font-size: 15px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn.sm { padding: 7px 14px; font-size: 13.5px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- Pacient ---------- */
.steps { display: flex; gap: 6px; margin: 4px 0 18px; flex-wrap: wrap; font-family: var(--f-ui); font-size: 13px; list-style: none; padding: 0; }
.steps li { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.steps li.on { background: var(--peach); border-color: var(--peach); color: var(--text); font-weight: 600; }
.steps li.done { color: var(--text); }
.pac { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
.svc-group h3 { font-size: 16px; font-family: var(--f-ui); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 8px; }
.svc { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; width: 100%; text-align: left; padding: 14px 16px; border: 1px solid var(--line); background: var(--paper); border-radius: 14px; cursor: pointer; margin-bottom: 8px; }
.svc:hover { border-color: var(--accent); }
.svc b { font-family: var(--f-d); font-weight: 500; font-size: 19px; }
.svc .price { font-family: var(--f-ui); font-weight: 600; font-size: 15px; align-self: center; font-variant-numeric: tabular-nums; }
.svc .meta { grid-column: 1; font-size: 16px; color: var(--muted); }
.chosen { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--cream); border-radius: 14px; padding: 12px 16px; }

.cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.cal-head h3 { text-transform: capitalize; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-family: var(--f-ui); font-variant-numeric: tabular-nums; }
.cal .dn { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; text-transform: uppercase; letter-spacing: .05em; }
.cal button { height: 54px; max-width: 100%; border: 1px solid transparent; background: none; border-radius: 12px; font-size: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.cal button:disabled { color: var(--muted); opacity: .4; cursor: default; }
.cal button.av { background: var(--peach-soft); font-weight: 600; }
.cal button.av:hover { border-color: var(--accent); }
.cal button.sel { background: var(--btn-bg); color: var(--btn-text); }
.cal button .cnt { font-size: 10px; font-weight: 500; opacity: .75; }
.slots-part h4 { font-family: var(--f-ui); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 8px; font-weight: 600; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
.slots button { padding: 9px 0; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; cursor: pointer; font-family: var(--f-ui); font-size: 15px; font-variant-numeric: tabular-nums; }
.slots button:hover { border-color: var(--accent); background: var(--peach-soft); }

.form { display: grid; gap: 14px; }
.form label { display: grid; gap: 5px; font-family: var(--f-ui); font-size: 14px; font-weight: 600; }
.form input, .form select, .form textarea { font-family: var(--f-ui); font-size: 15px; font-weight: 400; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); width: 100%; }
.form .hint { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.form .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; }
.form .check input { width: auto; margin-top: 3px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.err { color: var(--bad); font-family: var(--f-ui); font-size: 14px; }
.ok-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--good-bg); color: var(--good); font-family: var(--f-ui); font-weight: 600; font-size: 14px; padding: 6px 12px; border-radius: 999px; }
.mail { border: 1px dashed var(--line); border-radius: 14px; padding: 16px 18px; background: var(--bg); font-size: 17px; }
.mail .hdr { font-family: var(--f-ui); font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 10px; display: grid; gap: 2px; }
.mail p { margin: 0 0 8px; }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 8px 0; }
.dl dt { color: var(--muted); } .dl dd { margin: 0; }

/* ---------- Ordinace ---------- */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { font-family: var(--f-ui); font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); }
.adm-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .adm-grid { grid-template-columns: 1fr; } }
.wk-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.wk-bar h3 { font-family: var(--f-ui); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.stats { font-family: var(--f-ui); font-size: 13px; color: var(--muted); }
.wk-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
.wk { display: grid; grid-template-columns: 46px repeat(5, minmax(118px, 1fr)); min-width: 640px; font-family: var(--f-ui); }
.wk .hd { padding: 8px 6px; text-align: center; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); position: sticky; top: 0; background: var(--paper); z-index: 2; }
.wk .hd.today { color: var(--accent); }
.wk .hd small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.wk .corner { border-bottom: 1px solid var(--line); }
.axis { position: relative; }
.axis span { position: absolute; right: 6px; font-size: 11px; color: var(--muted); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.col { position: relative; border-left: 1px solid var(--line); cursor: copy;
  background-image: repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent 60px); }
.closed { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--block) 0 6px, transparent 6px 12px); cursor: default; }
.blk { position: absolute; left: 3px; right: 3px; border-radius: 8px; background: var(--block); border: 1px dashed var(--muted); font-size: 11.5px; padding: 3px 6px; color: var(--muted); overflow: hidden; cursor: default; }
.bk { position: absolute; left: 3px; right: 3px; border-radius: 8px; padding: 3px 7px; font-size: 12px; line-height: 1.25; overflow: hidden; cursor: pointer; border: 1px solid transparent; text-align: left; color: var(--text); }
.bk b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk .t { font-variant-numeric: tabular-nums; opacity: .8; }
.bk.noshow { background: repeating-linear-gradient(135deg, var(--bad-bg) 0 6px, var(--paper) 6px 12px) !important; text-decoration: line-through; border-color: var(--bad); }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: 0; margin-right: 6px; border: 1px solid var(--line); flex: none; }
.sw { display: flex; gap: 5px; flex-wrap: nowrap; }
.sw button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer; padding: 0; }
.sw button[aria-pressed="true"] { outline: 2px solid var(--text); outline-offset: 2px; }
.bk.sel { outline: 2px solid var(--text); }
@media (pointer: fine) { .bk { cursor: grab; } }
.bk.dragging { cursor: grabbing; opacity: .9; box-shadow: 0 6px 18px rgba(0,0,0,.18); z-index: 5; }
.bk.dragging.bad { outline: 2px solid var(--bad); }
.bk.busy-other { background: repeating-linear-gradient(135deg, var(--block) 0 5px, var(--paper) 5px 10px) !important; color: var(--muted); border: 1px dashed var(--line); cursor: default; }
.bk .who { position: absolute; bottom: 3px; right: 5px; font-size: 9.5px; font-weight: 700; letter-spacing: .03em; background: var(--paper); border-radius: 4px; padding: 0 4px; }
.acct { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; font-family: var(--f-ui); font-size: 14px; }
.acct select { font-family: var(--f-ui); font-size: 14px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-family: var(--f-ui); font-size: 13.5px; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); }
.slots button .sn { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 10px 0 14px; }
.sum div { background: var(--cream); border-radius: 12px; padding: 10px 12px; font-family: var(--f-ui); }
.sum small { display: block; font-size: 12px; color: var(--muted); }
.sum b { font-size: 19px; font-variant-numeric: tabular-nums; }
.sum .hl { background: var(--peach-soft); }
td.r, th.r { text-align: right; }
.who-pick { display: grid; gap: 8px; margin-bottom: 16px; }
.who-pick h3 { font-size: 17px; }
.bk.ghost { border: 2px dashed var(--text); opacity: .75; pointer-events: none; }
.lm { display: inline-block; font-family: var(--f-ui); font-size: 11px; font-weight: 700; background: var(--good-bg); color: var(--good); border-radius: 6px; padding: 0 5px; }
.slots button .lm { display: block; margin: 3px auto 0; width: max-content; }
.cal button .lm { font-size: 9.5px; padding: 0 3px; }
.old { text-decoration: line-through; opacity: .6; }
.sec { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; display: grid; gap: 8px; }
.sec h4 { margin: 0; font-family: var(--f-ui); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.sec .form { gap: 10px; }
.notebox { background: var(--cream); border-radius: 10px; padding: 8px 10px; font-size: 16px; }
.notebox small { display: block; font-family: var(--f-ui); font-size: 11.5px; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; font-family: var(--f-ui); font-size: 12.5px; color: var(--muted); display: grid; gap: 3px; }
.pend { background: var(--peach-soft); border-radius: 10px; padding: 8px 10px; font-family: var(--f-ui); font-size: 13.5px; }
.sms { white-space: pre-line; max-width: 330px; background: var(--good-bg); color: var(--text); border-radius: 18px 18px 18px 4px; padding: 10px 14px; font-family: var(--f-ui); font-size: 14.5px; line-height: 1.4; }
.ph { font-family: var(--f-ui); font-size: 12.5px; color: var(--muted); }
.ph code { background: var(--cream); padding: 1px 5px; border-radius: 5px; }
.bk .web { position: absolute; top: 4px; right: 5px; font-size: 9.5px; font-weight: 700; letter-spacing: .05em; background: var(--paper); border-radius: 4px; padding: 0 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--f-ui); font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 5px; }
.side { display: grid; gap: 12px; position: sticky; top: 12px; }
.side .card { padding: 18px; }
.side h3 { margin-bottom: 8px; }
.detail .dl { font-size: 16px; }
.confirm { background: var(--bad-bg); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; font-family: var(--f-ui); font-size: 14px; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-family: var(--f-ui); font-size: 14px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
td.num { font-variant-numeric: tabular-nums; }
td input, td select { font-family: var(--f-ui); font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); width: 100%; }
td input.short { width: 80px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--cream); }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.set-grid { display: grid; gap: 16px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--btn-bg); color: var(--btn-text); font-family: var(--f-ui); font-size: 14px; padding: 10px 18px; border-radius: 999px; z-index: 50; max-width: calc(100% - 32px); }
@media (max-width: 560px) { .two { grid-template-columns: 1fr; } .card { padding: 16px; } h2 { font-size: 23px; } }
/* ---------- Přívětivost ---------- */
.steps li button { all: unset; cursor: pointer; }
.steps li.done { border-color: var(--accent); }
.steps li.done:hover { background: var(--peach-soft); }
.quick { display: grid; gap: 8px; margin-bottom: 18px; }
.quick h3 { font-size: 17px; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.qgrid button { text-align: left; border: 1px solid var(--line); background: var(--peach-soft); border-radius: 14px; padding: 10px 12px; cursor: pointer; font-family: var(--f-ui); display: grid; gap: 1px; }
.qgrid button:hover { border-color: var(--accent); }
.qgrid b { font-size: 16px; } .qgrid .ph { font-size: 12px; }
.or { font-family: var(--f-ui); font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.dhead { display: flex; gap: 12px; align-items: flex-start; position: relative; padding-right: 28px; }
.dhead .sbar { width: 6px; align-self: stretch; border-radius: 6px; flex: none; }
.dhead h3 { margin: 0 0 2px; }
.dwhen { font-family: var(--f-ui); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.x { position: absolute; top: -4px; right: -4px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); }
.x:hover { background: var(--cream); }
.side.sheet .x { display: none; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 4px; }
.act { display: grid; gap: 1px; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-family: var(--f-ui); font-size: 14.5px; font-weight: 600; color: var(--text); text-decoration: none; }
.act small { font-weight: 400; font-size: 12px; color: var(--muted); }
.act:hover { border-color: var(--accent); background: var(--peach-soft); }
.act.on { border-color: var(--text); }
.act.danger { color: var(--bad); }
.act.danger:hover { background: var(--bad-bg); border-color: var(--bad); }
.detail .dl { font-size: 15.5px; margin-top: 12px; }
details.more { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
details.more > summary { cursor: pointer; font-family: var(--f-ui); font-size: 13px; font-weight: 600; color: var(--muted); }
.sec .sec-h { display: flex; justify-content: space-between; align-items: center; }
.saved { font-family: var(--f-ui); font-size: 12px; color: var(--good); }
.toast { display: flex; align-items: center; gap: 12px; }
.toast .undo { background: none; border: 0; color: var(--peach); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; }
.now { position: absolute; left: 0; right: 0; height: 2px; background: var(--bad); z-index: 3; pointer-events: none; }
.now::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }

      if (!gap) { render(); return toast('V tento den už má celou dobu směnu kolegyně'); }
      so2.hours[hp[1]] = gap; save(); render(); return toast('Uloženo – doplněna volná doba ' + hm(gap[0]) + '–' + hm(gap[1]));
    }
    if (d.hs !== undefined || d.he !== undefined) {
      var k = (d.hs !== undefined ? d.hs : d.he).split(':'), h = staff(k[0]).hours[k[1]], v = hmToMin(t.value); if (!h || isNaN(v)) return;
      var nv = d.hs !== undefined ? [v, h[1]] : [h[0], v];
      if (nv[1] <= nv[0]) { render(); return toast('Konec směny musí být po začátku'); }
      var cl = clashWeekly(+k[1], k[0], nv);
      if (cl) { render(); return toast('Překrývá se se směnou ' + cl.name + ' (' + hm(cl.hours[k[1]][0]) + '–' + hm(cl.hours[k[1]][1]) + '). V ordinaci je jedno křeslo.'); }
      h[0] = nv[0]; h[1] = nv[1]; save(); toast('Uloženo');
    }
  });
  var noteT;
  app.addEventListener('input', function (e) {
    var tg = e.target;
    if (tg.id === 'i-note') {
      clearTimeout(noteT); var st = document.getElementById('note-state'); if (st) st.textContent = 'Ukládám…';
      noteT = setTimeout(function () { var ib = S.bookings.filter(function (x) { return x.id === ui.sel; })[0]; if (!ib) return; ib.inote = tg.value; save(); var st2 = document.getElementById('note-state'); if (st2) st2.textContent = 'Uloženo ✓'; }, 600);
      return;
    }
    if (tg.id === 'n-q') { ui.newB.q = tg.value; document.getElementById('n-sug').innerHTML = sugHtml(tg.value); return; }
    if (ui.newB && /^n-(name|phone|email|inote)$/.test(tg.id)) { ui.newB[tg.name] = tg.value; return; }
    if (e.target.dataset.msg === 'sms') {
      var v = e.target.value, out = document.getElementById('sms-count'), pv = document.getElementById('sms-prev');
      if (out) out.textContent = smsCountText(smsParts(v)); if (pv) pv.textContent = smsText(v, SAMPLE); return;
    }
    if (e.target.id === 'voc-test') { document.getElementById('voc-out').textContent = vocative(e.target.value) || '…'; return; }
    if (e.target.id === 'q') { ui.q = e.target.value; var pos = e.target.selectionStart; render(); var q = document.getElementById('q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) {} }
  });

  // Nápověda pod myší: „+ 9:15“ ukáže, že do volného místa jde kliknout
  var hov = null;
  app.addEventListener('mousemove', function (e) {
    if (drag && drag.moving) return;
    var c = e.target.classList && e.target.classList.contains('col') ? e.target : null;
    if (!c) { if (hov) hov.hidden = true; return; }
    if (!hov || !document.contains(hov)) { hov = document.createElement('div'); hov.className = 'hov'; }
    if (hov.parentNode !== c) c.appendChild(hov);
    var r = c.getBoundingClientRect(), mins = GS + Math.floor((e.clientY - r.top) / PX / 15) * 15;
    hov.style.top = ((mins - GS) * PX + 1) + 'px'; hov.textContent = '+ ' + hm(mins); hov.hidden = false;
  });
  app.addEventListener('mouseleave', function () { if (hov) hov.hidden = true; });
  // Esc zavře detail nebo formulář
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || ui.view !== 'adm' || !(ui.sel || ui.mode)) return;
    ui.sel = null; ui.mode = null; ui.moveOpen = false; ui.mv = null; render();
  });

  // Přetažení termínu myší: po puštění se jen předvyplní formulář „Změnit termín“, přesun je potřeba potvrdit
  var drag = null;
  app.addEventListener('pointerdown', function (e) {
    var el = e.target.closest('.bk'); if (!el || el.classList.contains('ghost') || e.button !== 0 || e.pointerType === 'touch') return;
    var b = S.bookings.filter(function (x) { return x.id === +el.dataset.bk; })[0]; if (!b) return;
    drag = { b: b, el: el, x0: e.clientX, y0: e.clientY, offY: e.clientY - el.getBoundingClientRect().top, moving: false, to: null };
  });
  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (!drag.moving && Math.abs(e.clientX - drag.x0) + Math.abs(e.clientY - drag.y0) < 6) return;
    drag.moving = true; drag.el.classList.add('dragging'); drag.el.style.pointerEvents = 'none'; e.preventDefault();
    var under = document.elementFromPoint(e.clientX, e.clientY), c = under && under.closest('.col'); if (!c) return;
    if (drag.el.parentNode !== c) c.appendChild(drag.el);
    var r = c.getBoundingClientRect(), b = drag.b, mins = GS + Math.round((e.clientY - r.top - drag.offY) / PX / S.step) * S.step;
    mins = Math.max(GS, Math.min(GE - b.dur, mins));
    var ok = slots(c.dataset.col, b.dur, b.id, b.staff).indexOf(mins) > -1;
    drag.to = ok ? { date: c.dataset.col, start: mins } : null;
    drag.el.style.top = ((mins - GS) * PX + 1) + 'px'; drag.el.classList.toggle('bad', !ok);
    var tl = drag.el.querySelector('.t'); if (tl) tl.textContent = hm(mins) + (b.dur > 30 ? '–' + hm(mins + b.dur) : '');
  });
  window.addEventListener('pointerup', function () {
    if (!drag) return;
    var d = drag; drag = null; if (!d.moving) return;
    suppressClick = true; setTimeout(function () { suppressClick = false; }, 0);
    ui.sel = d.b.id; ui.mode = null; ui.confirm = false;
    if (d.to && (d.to.date !== d.b.date || d.to.start !== d.b.start)) { ui.mv = { id: d.b.id, date: d.to.date, start: d.to.start, svc: d.b.svc, staff: d.b.staff, notify: true, drag: true }; }
    else { ui.mv = null; if (!d.to) toast('Tam termín přesunout nejde, čas je obsazený nebo zavřeno'); }
    render();
  });

  render();
})();
</script>
