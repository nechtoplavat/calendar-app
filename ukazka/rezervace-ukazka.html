<title>ADent. rezervace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Crimson+Pro:wght@400;500;600&display=swap">
<style>
/* Rozvržení: horní lišta, pod ní buď rezervace pro pacienta (jeden sloupec), nebo ordinace (záložky + obsah).
   Barvy a písma převzaté z adentdh.com; ordinace je pracovní nástroj, proto v ní převládá bezpatkové písmo. */
:root {
  --bg: #FBF8F3; --paper: #FFFFFF; --soft: #F6F1EB; --text: #332622; --muted: #75655b; --line: #ECDFD3; --line-2: #F3EAE1;
  --accent: #71563F; --peach: #FDD2B9; --peach-soft: #FDEDE3;
  --btn-bg: #332622; --btn-text: #FBF8F3;
  --good: #2f7a4f; --good-bg: #E7F3EB; --bad: #B23A2A; --bad-bg: #FBE7E3;
  --closed: #F4EEE7; --block: #EAE3DB;
  --st1: #B4653A; --st2: #3F8A6E; --st3: #6A55A8; --st4: #2F6E9E; --st5: #A8456A;
  --c1: #FDD9C4; --c2: #D7EBD6; --c3: #D6E5F3; --c4: #E6DCF2; --c5: #F4E6BC; --c6: #F7D5DB; --c7: #CFEDE7; --c8: #EAE3DB;
  --f-d: "Lora", Georgia, serif; --f-t: "Crimson Pro", Georgia, serif;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --r: 16px; --r-sm: 10px;
  --shadow: 0 1px 2px rgba(51, 38, 34, .05), 0 4px 16px rgba(51, 38, 34, .05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #241B18; --paper: #2E2420; --soft: #382C27; --text: #F6F1EB; --muted: #C2B3A8; --line: #4A3B34; --line-2: #3B2F2A;
  --accent: #E7B896; --peach: #8A5A42; --peach-soft: #43322A;
  --btn-bg: #F6F1EB; --btn-text: #2B201D;
  --good: #8fd1a8; --good-bg: #223629; --bad: #F2A193; --bad-bg: #4A2722;
  --closed: #2A211D; --block: #3D312C;
  --st1: #E9A27A; --st2: #7FC2A5; --st3: #B7A6E8; --st4: #8DBDE3; --st5: #EB9BB8;
  --c1: #6E4A38; --c2: #34503A; --c3: #2F4A60; --c4: #4A3C5E; --c5: #5A4C2A; --c6: #5E3540; --c7: #2C524C; --c8: #4A3E37;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #241B18; --paper: #2E2420; --soft: #382C27; --text: #F6F1EB; --muted: #C2B3A8; --line: #4A3B34; --line-2: #3B2F2A;
  --accent: #E7B896; --peach: #8A5A42; --peach-soft: #43322A;
  --btn-bg: #F6F1EB; --btn-text: #2B201D;
  --good: #8fd1a8; --good-bg: #223629; --bad: #F2A193; --bad-bg: #4A2722;
  --closed: #2A211D; --block: #3D312C;
  --st1: #E9A27A; --st2: #7FC2A5; --st3: #B7A6E8; --st4: #8DBDE3; --st5: #EB9BB8;
  --c1: #6E4A38; --c2: #34503A; --c3: #2F4A60; --c4: #4A3C5E; --c5: #5A4C2A; --c6: #5E3540; --c7: #2C524C; --c8: #4A3E37;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark; }

/* ---------- Základ ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--text); font-family: var(--f-ui); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button, a, input, select, label { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:active:not(:disabled) { transform: scale(.98); }
.cg-ev:active, .cg-col:active { transform: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-family: var(--f-d); font-weight: 500; font-size: 22px; letter-spacing: -.01em; }
h3 { font-size: 15px; font-weight: 650; }
p { margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px 16px 24px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }

/* ---------- Ovládací prvky ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-text); font-weight: 600; font-size: 14.5px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn.ghost { background: var(--paper); color: var(--text); border-color: var(--line); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: 13.5px; }
.btn.lg { min-height: 48px; padding: 0 22px; font-size: 15.5px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
.ib { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); cursor: pointer; display: inline-grid; place-items: center; font-size: 18px; line-height: 1; color: var(--text); flex: none; }
.ib:disabled { opacity: .35; cursor: default; }
.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: 13.5px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--soft); border-radius: 999px; max-width: 100%; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.lm { background: var(--good-bg); color: var(--good); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; vertical-align: 0; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.panel-h p { width: 100%; }
.hint { font-size: 13px; color: var(--muted); }
.lbl { font-size: 13.5px; font-weight: 600; }
.field { display: grid; gap: 6px; font-size: 13.5px; font-weight: 600; min-width: 0; }
.field .hint { font-weight: 400; }
.input, .field input:not([type=checkbox]), .field select, .field textarea { width: 100%; min-height: 42px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); font-size: 15px; font-weight: 400; }
.field textarea { min-height: 0; resize: vertical; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--peach-soft); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; font-weight: 400; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.form { display: grid; gap: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--bad); font-size: 14px; background: var(--bad-bg); border-radius: var(--r-sm); padding: 8px 12px; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; border-bottom-color: var(--line); }
td.num, th.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.r, th.r { text-align: right; }
td input:not([type=checkbox]), td select { width: 100%; min-height: 36px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 14px; }
td input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 14px; background: var(--btn-bg); color: var(--btn-text); font-size: 14px; padding: 11px 18px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.2); width: max-content; max-width: calc(100% - 32px); }
.toast .undo { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; white-space: nowrap; }

/* ---------- Horní lišta ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.brand { font-family: var(--f-d); font-size: 26px; letter-spacing: -.01em; }
.brand span { color: var(--accent); }
.brand small { font-family: var(--f-ui); font-size: 13px; color: var(--muted); margin-left: 6px; }
.demo { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); background: var(--soft); border-radius: var(--r-sm); padding: 7px 12px; margin-bottom: 16px; }
.demo b { color: var(--text); }

/* ---------- Pacient ---------- */
.pac { max-width: 720px; margin: 0 auto; display: grid; gap: 14px; font-family: var(--f-t); font-size: 18px; }
.pac .panel { padding: 24px; }
.pac h2 { font-size: 26px; }
.pac h3 { font-family: var(--f-d); font-weight: 500; font-size: 19px; }
.pac .hint, .pac .field, .pac .btn, .pac .link, .pac .check, .pac .err { font-family: var(--f-ui); }
.steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; font-family: var(--f-ui); font-size: 13px; overflow-x: auto; scrollbar-width: none; }
.steps li { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; color: var(--muted); white-space: nowrap; }
.steps li .n { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11.5px; font-weight: 700; background: var(--soft); }
.steps li.on { background: var(--paper); color: var(--text); font-weight: 650; box-shadow: var(--shadow); }
.steps li.on .n { background: var(--btn-bg); color: var(--btn-text); }
.steps li.done .n { background: var(--good-bg); color: var(--good); }
.steps li button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.svc-group { display: grid; gap: 8px; margin-top: 18px; }
.svc-group > h3 { font-family: var(--f-ui); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.svc { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; width: 100%; text-align: left; padding: 14px 16px; border: 1px solid var(--line); background: var(--paper); border-radius: 14px; cursor: pointer; }
.svc b { font-family: var(--f-d); font-weight: 500; font-size: 19px; }
.svc .price { font-family: var(--f-ui); font-weight: 650; font-size: 15px; align-self: center; font-variant-numeric: tabular-nums; }
.svc .meta { grid-column: 1; font-size: 16px; color: var(--muted); }
.chosen { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--soft); border-radius: 14px; padding: 12px 16px; font-size: 17px; }
.chosen b { font-family: var(--f-d); font-weight: 500; }
.sub { font-family: var(--f-ui); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 20px 0 10px; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.qgrid button { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 14px; padding: 12px 14px; cursor: pointer; font-family: var(--f-ui); display: grid; gap: 2px; }
.qgrid .d { font-size: 13px; color: var(--muted); }
.qgrid b { font-size: 20px; font-variant-numeric: tabular-nums; }
.qgrid .w { font-size: 12.5px; color: var(--muted); }
.who { display: flex; gap: 6px; flex-wrap: wrap; font-family: var(--f-ui); }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: var(--f-ui); }
.chip[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); }
.mcal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.mcal-head h3 { text-transform: capitalize; }
.mcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-family: var(--f-ui); font-variant-numeric: tabular-nums; }
.mcal .dn { text-align: center; font-size: 11.5px; font-weight: 650; color: var(--muted); padding: 4px 0; text-transform: uppercase; letter-spacing: .05em; }
.mcal button { height: 48px; border: 1px solid transparent; background: none; border-radius: 12px; font-size: 15px; cursor: pointer; display: grid; place-items: center; align-content: center; gap: 1px; color: var(--text); }
.mcal button:disabled { color: var(--muted); opacity: .45; cursor: default; }
.mcal button.av { background: var(--peach-soft); font-weight: 650; }
.mcal button.sel { background: var(--btn-bg); color: var(--btn-text); }
.mcal button .lmx { font-size: 10px; font-weight: 700; color: var(--good); }
.mcal button.sel .lmx { color: inherit; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; font-family: var(--f-ui); }
.slots button { padding: 9px 4px; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; cursor: pointer; display: grid; gap: 1px; justify-items: center; }
.slots b { font-size: 16px; font-variant-numeric: tabular-nums; }
.slots small { font-size: 11.5px; color: var(--muted); }
.slots .lmx { font-size: 11px; font-weight: 700; color: var(--good); }
.or { font-family: var(--f-ui); font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 10px; margin: 20px 0 12px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.ok-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--good-bg); color: var(--good); font-family: var(--f-ui); font-weight: 650; font-size: 14px; padding: 6px 12px; border-radius: 999px; }
.mail { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; background: var(--bg); font-size: 17px; display: grid; gap: 8px; }
.mail .hdr { font-family: var(--f-ui); font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 8px; display: grid; gap: 2px; }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 0; }
.dl dt { color: var(--muted); } .dl dd { margin: 0; min-width: 0; }
.sms { white-space: pre-line; max-width: 320px; background: var(--good-bg); border-radius: 18px 18px 18px 4px; padding: 10px 14px; font-family: var(--f-ui); font-size: 14.5px; line-height: 1.4; }
.old { text-decoration: line-through; opacity: .55; }

/* ---------- Ordinace: kostra ---------- */
.adm-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 12px 12px 11px; font-size: 14.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; flex: none; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--paper); flex: none; }
.me select { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 5px 8px; font-size: 13px; max-width: 190px; }
.page { display: grid; gap: 16px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.side { position: sticky; top: 12px; display: grid; gap: 12px; }

/* ---------- Kalendář ---------- */
.cal-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.cal-nav { display: flex; align-items: center; gap: 6px; min-width: 0; }
.cal-title { font-family: var(--f-d); font-weight: 500; font-size: 21px; margin-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-tools { display: flex; align-items: center; gap: 8px; }
.cal-sub { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.cal-sum { font-size: 13px; color: var(--muted); }
.cal-sum b { color: var(--text); font-weight: 650; }
.cal { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.cg-row { display: grid; grid-template-columns: 52px repeat(var(--cols), minmax(0, 1fr)); }
.cg-head { border-bottom: 1px solid var(--line); background: var(--paper); box-shadow: 0 1px 0 var(--line); }
.cg-day { border: 0; border-left: 1px solid var(--line-2); background: none; cursor: pointer; padding: 10px 4px 9px; display: grid; justify-items: center; gap: 2px; color: var(--text); min-width: 0; }
.cg-day .dw { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.cg-day .dd { font-size: 20px; font-weight: 600; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.cg-day.today .dd { background: var(--btn-bg); color: var(--btn-text); }
.cg-day.today .dw { color: var(--text); }
.cg-day .sh { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.cg-day .sh span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.cg-day .sh .shp { padding: 2px 8px 2px 3px; border-radius: 999px; background: color-mix(in srgb, var(--sc) 16%, var(--paper)); color: var(--text); font-weight: 600; }
.cg-day .sh .shp b { width: 18px; height: 18px; border-radius: 50%; background: var(--sc); color: var(--paper); font-size: 9.5px; display: inline-grid; place-items: center; }
.cg-times { position: relative; }
.cg-times span { position: absolute; right: 8px; font-size: 11.5px; color: var(--muted); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.cg-col { position: relative; border-left: 1px solid var(--line-2); cursor: pointer; }
.cg-col .hl { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--line-2); }
.cg-col .hl.half { border-top-style: dashed; opacity: .7; }
.cg-closed { position: absolute; left: 0; right: 0; background: var(--closed); cursor: default; }
/* Směna v ploše dne: jemné podbarvení + pruh s iniciálami a jménem hygienistky */
.cg-shift { position: absolute; left: 0; right: 0; background: color-mix(in srgb, var(--sc) 6%, transparent); pointer-events: none; }
.cg-shift + .cg-shift, .cg-shift.next { border-top: 2px dashed color-mix(in srgb, var(--sc) 55%, transparent); }
.cg-band { position: absolute; left: 0; width: 24px; background: color-mix(in srgb, var(--sc) 20%, var(--paper)); border-right: 2px solid var(--sc); pointer-events: none; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 4px; }
.cg-band .av { width: 19px; height: 19px; border-radius: 50%; background: var(--sc); color: var(--paper); font-size: 9px; font-weight: 700; display: grid; place-items: center; flex: none; }
.cg-band .nm { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; font-weight: 650; color: var(--text); white-space: nowrap; letter-spacing: .02em; }
.cal.multi { --evl: 30px; }
.cg-block { position: absolute; left: var(--evl, 6px); right: 5px; border: 0; border-radius: 8px; background: repeating-linear-gradient(135deg, var(--block) 0 8px, var(--closed) 8px 16px); font-size: 12px; color: var(--muted); padding: 4px 8px; overflow: hidden; cursor: default; font-weight: 650; text-align: left; display: block; }
.cg-block.sel { box-shadow: 0 0 0 2px var(--text); }
@media (pointer: fine) { .cg-block.ed, .sh-blk { cursor: grab; } }
.cg-block.sel, .sh-blk.sel { touch-action: none; }
.cg-block.dragging, .sh-blk.dragging { opacity: .92; box-shadow: 0 10px 24px rgba(0,0,0,.22); z-index: 6; cursor: grabbing; }
.cg-block.bad, .sh-blk.bad { box-shadow: 0 0 0 2px var(--bad); }
.sh-blk { position: absolute; left: 4px; right: 8px; border-radius: 10px; background: color-mix(in srgb, var(--sc) 15%, var(--paper)); border: 1px solid color-mix(in srgb, var(--sc) 40%, transparent); border-left: 5px solid var(--sc); padding: 6px 7px; overflow: hidden; display: flex; flex-direction: column; gap: 3px; color: var(--text); z-index: 2; min-width: 0; }

.sh-blk .bn { font-size: 11.5px; color: var(--muted); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-closed { position: absolute; left: 4px; right: 8px; z-index: 4; pointer-events: none; border-radius: 8px; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--block) 92%, transparent) 0 6px, color-mix(in srgb, var(--closed) 85%, transparent) 6px 12px); border: 1px dashed var(--muted); padding: 2px 6px; overflow: hidden; font-size: 11.5px; font-weight: 650; color: var(--muted); }
.sh-closed span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.shcal .cg-day { position: relative; }
.mini { border: 0; background: var(--peach-soft); border-radius: 999px; font-size: 11px; font-weight: 650; padding: 2px 8px; cursor: pointer; color: var(--text); margin-top: 3px; white-space: nowrap; }
.cg-quick.shq button { display: flex; align-items: center; gap: 8px; }
.nprice { font-size: 14px; }
.addst { background: var(--soft); border-radius: 14px; padding: 16px; margin: 4px 0 16px; display: grid; gap: 12px; }
.addst h3 { font-size: 17px; }
.cg-ev { position: absolute; left: var(--evl, 6px); right: 5px; border: 0; border-radius: 8px; padding: 4px 8px; text-align: left; overflow: hidden; cursor: pointer; color: var(--text); background: var(--c, var(--c8)); box-shadow: 0 0 0 1.5px var(--paper); display: flex; flex-direction: column; line-height: 1.25; }

.cg-ev .s { font-size: 12px; opacity: .78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cg-ev.compact { flex-direction: row; align-items: center; gap: 6px; padding-top: 2px; padding-bottom: 2px; }
.cg-ev.sel { box-shadow: 0 0 0 2px var(--text); z-index: 3; }

.cg-ev .web { position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.cg-ev.other { background: var(--block); color: var(--muted); cursor: default; }

.cg-ev.dragging { opacity: .92; box-shadow: 0 10px 24px rgba(0,0,0,.22); z-index: 6; cursor: grabbing; }
.cg-ev.dragging.bad { box-shadow: 0 0 0 2px var(--bad); }
@media (pointer: fine) { .cg-ev[data-bk] { cursor: grab; } }
.cg-now { position: absolute; left: 0; right: 0; height: 2px; background: var(--bad); z-index: 4; pointer-events: none; }
.cg-now::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
.cg-hov { position: absolute; left: var(--evl, 6px); right: 5px; border: 1.5px dashed var(--accent); border-radius: 8px; font-size: 12px; font-weight: 650; color: var(--accent); padding: 3px 8px; pointer-events: none; z-index: 2; }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.dstrip { display: none; }
.fab { display: none; }

/* Program dne a detail termínu */
.agenda { display: grid; gap: 2px; }
.todo .who { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; margin: 14px 0 4px; }
.todo .who:first-of-type { margin-top: 4px; }
.todo .grp { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 12px 0 2px; }
.todo .grp span { letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
.todo .grp.done span { color: var(--good); }
.todo ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.todo li { display: flex; align-items: flex-start; gap: 4px; }
.todo label { flex: 1; display: flex; gap: 10px; align-items: flex-start; padding: 7px 6px; border-radius: 8px; cursor: pointer; font-size: 14px; line-height: 1.35; touch-action: manipulation; }
.todo label input { width: 18px; height: 18px; margin: 0; accent-color: var(--good); flex: none; }
.todo label:has(input:checked) span { text-decoration: line-through; color: var(--muted); }
.todo .rm { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 6px 8px; cursor: pointer; border-radius: 8px; }
.todo-add { display: flex; gap: 6px; margin-top: 10px; }
.todo-add input { flex: 1; min-width: 0; }
.prog { height: 4px; border-radius: 3px; background: var(--soft); overflow: hidden; margin-top: 4px; }
.prog i { display: block; height: 100%; background: var(--good); }
.tdl { display: grid; gap: 6px; } .tdl .row { display: flex; gap: 6px; align-items: center; } .tdl .row input { flex: 1; min-width: 0; } .tdl .row .x { position: static; flex: none; }
kbd { font-family: inherit; font-size: 11px; font-weight: 600; line-height: 1; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 2px 5px; background: var(--paper); }
@media (hover: none) { .kb-only { display: none; } }
.ag { display: grid; grid-template-columns: 46px 4px 1fr; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 10px; border: 0; background: none; text-align: left; cursor: pointer; width: 100%; color: var(--text); }
.ag .t { font-size: 13.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
.ag .bar { align-self: stretch; border-radius: 4px; min-height: 30px; }
.ag .n { font-size: 14px; font-weight: 600; } .ag .s { font-size: 12.5px; color: var(--muted); }
.ag.free .t { font-weight: 400; color: var(--muted); }
.ag.free .bar { min-height: 0; height: 100%; border-left: 2px dotted var(--line); width: 0; margin-left: 1px; }
.ag.free .n { font-weight: 400; color: var(--muted); font-size: 13px; }
.dhead { display: flex; gap: 12px; align-items: flex-start; position: relative; padding-right: 34px; }
.dhead .bar { width: 5px; align-self: stretch; border-radius: 5px; flex: none; }
.dhead h3 { font-family: var(--f-d); font-weight: 500; font-size: 21px; }
.dwhen { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.x { position: absolute; top: -6px; right: -6px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0 6px; }
.act { display: grid; gap: 1px; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-size: 14px; font-weight: 650; color: var(--text); text-decoration: none; }
.act small { font-weight: 400; font-size: 12px; color: var(--muted); }
.act.on { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.act.danger { color: var(--bad); }
.sec { border-top: 1px solid var(--line-2); margin-top: 14px; padding-top: 14px; display: grid; gap: 10px; }
.sec-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sec-h h4 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650; }
.note { background: var(--soft); border-radius: 10px; padding: 8px 11px; font-size: 14px; }
.note small { display: block; font-size: 11.5px; color: var(--muted); }
.saved { font-size: 12px; color: var(--good); }
.log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; color: var(--muted); display: grid; gap: 3px; }
details.more { margin-top: 14px; border-top: 1px solid var(--line-2); padding-top: 12px; }
details.more > summary, details.acc > summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.pend { background: var(--peach-soft); border-radius: 10px; padding: 8px 11px; font-size: 13.5px; }
.tchips { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 5px; }
.tchips button { min-height: 36px; border: 1px solid var(--line); background: var(--paper); border-radius: 9px; cursor: pointer; font-size: 14px; font-variant-numeric: tabular-nums; }
.tchips button[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); }
.qdays { display: flex; gap: 6px; flex-wrap: wrap; }
.qdays .chip { padding: 6px 12px; font-size: 13.5px; }
.sug { display: grid; gap: 4px; }
.sug button { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 11px; cursor: pointer; font-size: 14px; display: grid; }
.sug small { color: var(--muted); font-size: 12px; }
.sug .new { background: var(--soft); }
.chosenp { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.sheet-bar, .backdrop { display: none; }

/* ---------- Ostatní stránky ---------- */
.sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.sum div { background: var(--soft); border-radius: 12px; padding: 12px 14px; }
.sum small { display: block; font-size: 12px; color: var(--muted); }
.sum b { font-size: 20px; font-variant-numeric: tabular-nums; }
.sum .hl { background: var(--peach-soft); }
.wtables { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 20px; }
.wtables table { table-layout: fixed; }
.wtables th:nth-child(1) { width: 44px; } .wtables th:nth-child(2) { width: 38px; }
.wtables td { padding: 6px 4px; }
.wtables td input[type=time] { padding: 6px 4px; }
.wtables h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.sw { display: flex; gap: 5px; }
.sw button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer; padding: 0; }
.sw button[aria-pressed="true"] { outline: 2px solid var(--text); outline-offset: 2px; }
.ph code { background: var(--soft); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }

/* ---------- Nápověda ⓘ ---------- */
.info { position: relative; flex: none; display: inline-block; }
.info > summary { list-style: none; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font: italic 600 13px/1 Georgia, serif; color: var(--muted); cursor: pointer; background: var(--paper); user-select: none; }
.info > summary::-webkit-details-marker { display: none; }
.info > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.info[open] > summary { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); }
.info-pop { position: absolute; right: 0; top: 32px; z-index: 40; width: min(320px, calc(100vw - 32px)); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, .16); padding: 12px 14px; font-family: var(--f-ui); font-size: 13.5px; font-weight: 400; line-height: 1.5; color: var(--text); text-align: left; text-transform: none; letter-spacing: 0; white-space: normal; display: grid; gap: 6px; }
.info-pop .legend { margin: 0; display: grid; gap: 6px; font-size: 13px; color: var(--text); }
.info-pop code { background: var(--soft); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
.panel-h > .info, .cal-tools > .info { margin-left: auto; }
.hd-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* ---------- Posouvání kalendáře uvnitř (počítač) ---------- */
.cg-scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
.cg-scroll .cg-head { position: sticky; top: 0; z-index: 5; }
.side.fit { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }

/* ---------- Směny ---------- */
.shgrid { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: -8px; }
.shgrid th { border: 0; padding: 0 6px 2px; }
.shgrid td { border: 0; padding: 0 4px; vertical-align: stretch; }
.shgrid td.day { width: 96px; padding-left: 0; font-weight: 650; font-size: 14.5px; white-space: nowrap; }
.shgrid td.day small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.shgrid tr.today td.day { color: var(--accent); }
.shgrid td.closed-cell { color: var(--muted); font-size: 13px; padding-left: 12px; }
.shc { width: 100%; min-height: 66px; text-align: left; border: 1px solid var(--line); border-left: 6px solid var(--sc, var(--line)); background: var(--paper); border-radius: 12px; padding: 8px 12px; cursor: pointer; display: grid; gap: 3px; align-content: center; color: var(--text); }
.shc.sel { box-shadow: 0 0 0 2px var(--text); }
.shc.empty { border-style: dashed; border-left-width: 1px; background: var(--soft); }
.shc.empty .nm { color: var(--muted); font-weight: 600; }
.shc .tm { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.shc .nm { font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.shc .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.avatar.sm { width: 24px; height: 24px; font-size: 10.5px; }
.wsum { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.wsum div { display: flex; align-items: center; gap: 10px; background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.wsum b { display: block; }
.wsum.one { grid-template-columns: 1fr; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); cursor: pointer; font-size: 14.5px; font-weight: 600; color: var(--text); }
.opt[aria-pressed="true"] { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.opt .chk { margin-left: auto; font-weight: 700; }
.opt.none .avatar { background: var(--soft); color: var(--muted); }
.warn { background: var(--peach-soft); border-radius: 10px; padding: 9px 12px; font-size: 13.5px; }
.sdt td input[type=time] { min-width: 0; }

.cg-block .bl { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cg-block .bt { display: block; font-weight: 500; font-size: 11.5px; font-variant-numeric: tabular-nums; }
/* úchyty pro prodloužení / zkrácení */
:is(.cg-block, .sh-blk) .rz { position: absolute; left: 0; right: 0; height: 12px; cursor: ns-resize; touch-action: none; z-index: 2; }
:is(.cg-block, .sh-blk) .rz-t { top: -4px; } :is(.cg-block, .sh-blk) .rz-b { bottom: -4px; }
:is(.cg-block, .sh-blk) .rz::after { content: ""; position: absolute; left: 50%; top: 4px; width: 30px; height: 4px; margin-left: -15px; border-radius: 3px; background: var(--text); opacity: 0; transition: opacity .12s; }
:is(.cg-block, .sh-blk).sel .rz::after { opacity: .55; }
:is(.cg-block, .sh-blk).resizing { box-shadow: 0 0 0 2px var(--text), 0 8px 20px rgba(0,0,0,.15); z-index: 6; }
/* rychlá nabídka po klepnutí do prázdného místa */
.cg-quick { position: absolute; left: var(--evl, 6px); right: 4px; z-index: 8; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px rgba(0, 0, 0, .18); padding: 6px; display: grid; gap: 4px; min-width: 128px; }
.cg-quick .qh { font-size: 12px; font-weight: 650; color: var(--muted); padding: 2px 6px; font-variant-numeric: tabular-nums; }
.cg-quick button { border: 0; background: var(--soft); border-radius: 8px; padding: 8px 10px; text-align: left; font-size: 13.5px; font-weight: 650; cursor: pointer; color: var(--text); white-space: nowrap; }
.cg-quick button.primary { background: var(--btn-bg); color: var(--btn-text); }
.cg-qslot { position: absolute; left: var(--evl, 6px); right: 4px; border: 2px dashed var(--text); border-radius: 8px; pointer-events: none; z-index: 7; }
/* Efekty pod myší jen na zařízeních s myší – na dotykovém displeji by „ulpívaly“ */
@media (hover: hover) {
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost:hover { border-color: var(--accent); filter: none; }
  .ib:hover { border-color: var(--accent); }
  .steps li.done:hover { background: var(--soft); }
  .svc:hover { border-color: var(--accent); background: var(--peach-soft); }
  .qgrid button:hover { border-color: var(--accent); background: var(--peach-soft); }
  .chip:hover { border-color: var(--accent); }
  .mcal button.av:hover { border-color: var(--accent); }
  .slots button:hover { border-color: var(--accent); background: var(--peach-soft); }
  .tab:hover { color: var(--text); }
  .cg-day:hover { background: var(--soft); }
  .cg-block.ed:hover .rz::after, .sh-blk:hover .rz::after { opacity: .45; }
  .cg-day.static { cursor: default; } .cg-day.static:hover { background: none; }
  .cg-block.ed { cursor: pointer; }
  .cg-ev:hover { box-shadow: 0 0 0 1.5px var(--paper), 0 4px 12px rgba(51, 38, 34, .18); z-index: 3; }
  .ag:hover { background: var(--soft); }
  .ag.free { cursor: default; padding-top: 4px; padding-bottom: 4px; } .ag.free:hover { background: none; }
  .x:hover { background: var(--soft); color: var(--text); }
  .act:hover { border-color: var(--accent); background: var(--peach-soft); }
  .act.danger:hover { background: var(--bad-bg); border-color: var(--bad); }
  .tchips button:hover { border-color: var(--accent); }
  .sug button:hover { border-color: var(--accent); background: var(--peach-soft); }
  .shc:hover { background: var(--soft); }
  .shc.ro { cursor: default; } .shc.ro:hover { background: var(--paper); }
  .opt:hover { border-color: var(--accent); }
}

/* ---------- Mobil ---------- */
@media (max-width: 900px) {
  .cols { grid-template-columns: 1fr; }
  .side { position: static; }
}
@media (max-width: 700px) {
  .wrap { padding-top: 10px; padding-bottom: 96px; }
  .brand { font-size: 22px; }
  .top .seg { width: 100%; } .top .seg button { flex: 1; }
  .two { grid-template-columns: 1fr; }
  .panel { padding: 16px; }
  .pac .panel { padding: 18px; }
  .pac h2 { font-size: 23px; }
  .adm-top { margin-inline: -16px; padding-inline: 16px; flex-wrap: wrap; gap: 0; }
  .me { order: -1; width: 100%; justify-content: flex-end; padding-bottom: 6px; }
  .tabs { width: 100%; margin-inline: 0; gap: 0; }
  .tab { flex: 1 1 auto; padding-inline: 2px; font-size: clamp(12px, 3.45vw, 13.5px); }
  .steps li { padding: 6px 9px; }
  .steps li:not(.on) .l { display: none; }
  .panel .seg { width: 100%; overflow-x: auto; } .panel .seg button { flex: 1; }
  .cal-bar { margin-bottom: 8px; flex-wrap: nowrap; }
  .cal-title { font-size: 17px; margin-left: 4px; }
  .cal-tools { display: none; }
  .cal-sub .seg { width: 100%; overflow-x: auto; } .cal-sub .seg button { flex: 1; }
  .dstrip { display: grid; grid-template-columns: repeat(var(--n, 7), minmax(0, 1fr)); gap: 4px; margin-bottom: 10px; }
  .dstrip button { border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 6px 2px; cursor: pointer; display: grid; justify-items: center; font-size: 11.5px; color: var(--muted); }
  .dstrip button b { font-size: 17px; color: var(--text); font-variant-numeric: tabular-nums; }
  .dstrip button[aria-pressed="true"] { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-text); }
  .dstrip button[aria-pressed="true"] b { color: var(--btn-text); }
  .dstrip button.today:not([aria-pressed="true"]) { border-color: var(--text); }
  .dstrip .n { font-size: 10px; }
  .cg-row { grid-template-columns: 46px repeat(var(--cols), minmax(0, 1fr)); }

    daniel: 'Danieli', samuel: 'Samueli', gabriel: 'Gabrieli', rafael: 'Rafaeli', emanuel: 'Emanueli', marcel: 'Marceli', noel: 'Noeli',

    if (/[eéěiíoóuúůyý]$/.test(low)) return w;                             // Marie, Jiří beze změny
    if (/něk$/.test(low)) return w.slice(0, -3) + 'ňku';                    // Zdeněk → Zdeňku
    if (/děk$/.test(low)) return w.slice(0, -3) + 'ďku';
    if (/ek$/.test(low)) return w.slice(0, -2) + 'ku';                      // Marek → Marku
    if (/(k|h|g|ch)$/.test(low)) return w + 'u';                           // Dominik → Dominiku
    if (/[šžčřcjďťňx]$/.test(low)) return w + 'i';                         // Tomáš → Tomáši
    if (/[^aeiouyáéíóúůý]r$/.test(low)) return w.slice(0, -1) + 'ře';       // Alexandr → Alexandře

  });
  window.addEventListener('pointermove', function (e) {

      e.preventDefault();
      var un = document.elementFromPoint(e.clientX, e.clientY), cc = un && un.closest('.cg-col'); if (!cc) return;
      if (gd.el.parentNode !== cc) cc.appendChild(gd.el);
      gd.ck = cc.dataset.col || cc.dataset.scol;
      var du = gd.e0 - gd.s0, s2 = gd.s0;
      if (!gd.full) {
        var rr = cc.getBoundingClientRect(); s2 = G.GS + Math.round((e.clientY - rr.top - gd.offY) / G.PX / 15) * 15;
        s2 = Math.max(G.GS, Math.min(G.GE - du, s2));

      }
      gd.ns = s2; gd.ne = s2 + du;

      save(); render();
      return toast('Zavřeno ' + (g.ck !== g.ck0 ? dShort(k.date) + ' ' : '') + (g.full ? 'celý den' : hm(k.start) + '–' + hm(k.end)) + (cl ? ' · pozor, je tam objednaný pacient' : ''), true);
    }
    var u = shSnap(), x = shFind(g.ck0, g.id); if (!x) return render();
    if (g.ck !== g.ck0) { shRemove(g.ck0, g.id); x = shAdd(g.ck, { staff: x.staff, start: g.ns, end: g.ne, note: x.note || '' }); }
    else { x.start = g.ns; x.end = g.ne; }
