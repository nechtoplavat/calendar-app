<title>ADent. rezervace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Crimson+Pro:wght@400;500;600&display=swap">
<style>
/* Rozvržení: horní lišta, pod ní buď rezervace pro pacienta (jeden sloupec), nebo ordinace (záložky + obsah).
   Barvy a písma převzaté z adentdh.com; ordinace je pracovní nástroj, proto v ní převládá bezpatkové písmo. */
:root {
  --bg: #FBF8F3; --paper: #FFFFFF; --soft: #F6F1EB; --text: #332622; --muted: #75655b; --line: #ECDFD3; --line-2: #F3EAE1;
  --accent: #71563F; --peach: #FDD2B9; --peach-soft: #FDEDE3;
  --btn-bg: #332622; --btn-text: #FBF8F3;
  --good: #2f7a4f; --good-bg: #E7F3EB; --bad: #B23A2A; --bad-bg: #FBE7E3;
  --closed: #F4EEE7; --block: #EAE3DB;
  --st1: #8A6A50; --st2: #4F8A72;
  --c1: #FDD9C4; --c2: #D7EBD6; --c3: #D6E5F3; --c4: #E6DCF2; --c5: #F4E6BC; --c6: #F7D5DB; --c7: #CFEDE7; --c8: #EAE3DB;
  --f-d: "Lora", Georgia, serif; --f-t: "Crimson Pro", Georgia, serif;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --r: 16px; --r-sm: 10px;
  --shadow: 0 1px 2px rgba(51, 38, 34, .05), 0 4px 16px rgba(51, 38, 34, .05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #241B18; --paper: #2E2420; --soft: #382C27; --text: #F6F1EB; --muted: #C2B3A8; --line: #4A3B34; --line-2: #3B2F2A;
  --accent: #E7B896; --peach: #8A5A42; --peach-soft: #43322A;
  --btn-bg: #F6F1EB; --btn-text: #2B201D;
  --good: #8fd1a8; --good-bg: #223629; --bad: #F2A193; --bad-bg: #4A2722;
  --closed: #2A211D; --block: #3D312C;
  --st1: #D3A985; --st2: #7FC2A5;
  --c1: #6E4A38; --c2: #34503A; --c3: #2F4A60; --c4: #4A3C5E; --c5: #5A4C2A; --c6: #5E3540; --c7: #2C524C; --c8: #4A3E37;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #241B18; --paper: #2E2420; --soft: #382C27; --text: #F6F1EB; --muted: #C2B3A8; --line: #4A3B34; --line-2: #3B2F2A;
  --accent: #E7B896; --peach: #8A5A42; --peach-soft: #43322A;
  --btn-bg: #F6F1EB; --btn-text: #2B201D;
  --good: #8fd1a8; --good-bg: #223629; --bad: #F2A193; --bad-bg: #4A2722;
  --closed: #2A211D; --block: #3D312C;
  --st1: #D3A985; --st2: #7FC2A5;
  --c1: #6E4A38; --c2: #34503A; --c3: #2F4A60; --c4: #4A3C5E; --c5: #5A4C2A; --c6: #5E3540; --c7: #2C524C; --c8: #4A3E37;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark; }

/* ---------- Základ ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--text); font-family: var(--f-ui); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-family: var(--f-d); font-weight: 500; font-size: 22px; letter-spacing: -.01em; }
h3 { font-size: 15px; font-weight: 650; }
p { margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px 16px 72px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }

/* ---------- Ovládací prvky ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-text); font-weight: 600; font-size: 14.5px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { filter: brightness(1.12); }
.btn.ghost { background: var(--paper); color: var(--text); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); filter: none; }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: 13.5px; }
.btn.lg { min-height: 48px; padding: 0 22px; font-size: 15.5px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
.ib { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); cursor: pointer; display: inline-grid; place-items: center; font-size: 18px; line-height: 1; color: var(--text); flex: none; }
.ib:hover { border-color: var(--accent); }
.ib:disabled { opacity: .35; cursor: default; }
.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: 13.5px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--soft); border-radius: 999px; max-width: 100%; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.lm { background: var(--good-bg); color: var(--good); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; vertical-align: 0; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.panel-h p { width: 100%; }
.hint { font-size: 13px; color: var(--muted); }
.lbl { font-size: 13.5px; font-weight: 600; }
.field { display: grid; gap: 6px; font-size: 13.5px; font-weight: 600; min-width: 0; }
.field .hint { font-weight: 400; }
.input, .field input:not([type=checkbox]), .field select, .field textarea { width: 100%; min-height: 42px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); font-size: 15px; font-weight: 400; }
.field textarea { min-height: 0; resize: vertical; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--peach-soft); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; font-weight: 400; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.form { display: grid; gap: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--bad); font-size: 14px; background: var(--bad-bg); border-radius: var(--r-sm); padding: 8px 12px; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; border-bottom-color: var(--line); }
td.num, th.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.r, th.r { text-align: right; }
td input:not([type=checkbox]), td select { width: 100%; min-height: 36px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 14px; }
td input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 14px; background: var(--btn-bg); color: var(--btn-text); font-size: 14px; padding: 11px 18px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
.toast .undo { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; white-space: nowrap; }

/* ---------- Horní lišta ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.brand { font-family: var(--f-d); font-size: 26px; letter-spacing: -.01em; }
.brand span { color: var(--accent); }
.brand small { font-family: var(--f-ui); font-size: 13px; color: var(--muted); margin-left: 6px; }
.demo { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); background: var(--soft); border-radius: var(--r-sm); padding: 7px 12px; margin-bottom: 16px; }
.demo b { color: var(--text); }

/* ---------- Pacient ---------- */
.pac { max-width: 720px; margin: 0 auto; display: grid; gap: 14px; font-family: var(--f-t); font-size: 18px; }
.pac .panel { padding: 24px; }
.pac h2 { font-size: 26px; }
.pac h3 { font-family: var(--f-d); font-weight: 500; font-size: 19px; }
.pac .hint, .pac .field, .pac .btn, .pac .link, .pac .check, .pac .err { font-family: var(--f-ui); }
.steps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; font-family: var(--f-ui); font-size: 13px; overflow-x: auto; scrollbar-width: none; }
.steps li { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; color: var(--muted); white-space: nowrap; }
.steps li .n { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11.5px; font-weight: 700; background: var(--soft); }
.steps li.on { background: var(--paper); color: var(--text); font-weight: 650; box-shadow: var(--shadow); }
.steps li.on .n { background: var(--btn-bg); color: var(--btn-text); }
.steps li.done .n { background: var(--good-bg); color: var(--good); }
.steps li button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.steps li.done:hover { background: var(--soft); }
.svc-group { display: grid; gap: 8px; margin-top: 18px; }
.svc-group > h3 { font-family: var(--f-ui); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.svc { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; width: 100%; text-align: left; padding: 14px 16px; border: 1px solid var(--line); background: var(--paper); border-radius: 14px; cursor: pointer; }
.svc:hover { border-color: var(--accent); background: var(--peach-soft); }
.svc b { font-family: var(--f-d); font-weight: 500; font-size: 19px; }
.svc .price { font-family: var(--f-ui); font-weight: 650; font-size: 15px; align-self: center; font-variant-numeric: tabular-nums; }
.svc .meta { grid-column: 1; font-size: 16px; color: var(--muted); }
.chosen { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--soft); border-radius: 14px; padding: 12px 16px; font-size: 17px; }
.chosen b { font-family: var(--f-d); font-weight: 500; }
.sub { font-family: var(--f-ui); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 20px 0 10px; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.qgrid button { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 14px; padding: 12px 14px; cursor: pointer; font-family: var(--f-ui); display: grid; gap: 2px; }
.qgrid button:hover { border-color: var(--accent); background: var(--peach-soft); }
.qgrid .d { font-size: 13px; color: var(--muted); }
.qgrid b { font-size: 20px; font-variant-numeric: tabular-nums; }
.qgrid .w { font-size: 12.5px; color: var(--muted); }
.who { display: flex; gap: 6px; flex-wrap: wrap; font-family: var(--f-ui); }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: var(--f-ui); }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); }
.mcal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.mcal-head h3 { text-transform: capitalize; }
.mcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-family: var(--f-ui); font-variant-numeric: tabular-nums; }
.mcal .dn { text-align: center; font-size: 11.5px; font-weight: 650; color: var(--muted); padding: 4px 0; text-transform: uppercase; letter-spacing: .05em; }
.mcal button { height: 48px; border: 1px solid transparent; background: none; border-radius: 12px; font-size: 15px; cursor: pointer; display: grid; place-items: center; align-content: center; gap: 1px; color: var(--text); }
.mcal button:disabled { color: var(--muted); opacity: .45; cursor: default; }
.mcal button.av { background: var(--peach-soft); font-weight: 650; }
.mcal button.av:hover { border-color: var(--accent); }
.mcal button.sel { background: var(--btn-bg); color: var(--btn-text); }
.mcal button .lmx { font-size: 10px; font-weight: 700; color: var(--good); }
.mcal button.sel .lmx { color: inherit; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; font-family: var(--f-ui); }
.slots button { padding: 9px 4px; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; cursor: pointer; display: grid; gap: 1px; justify-items: center; }
.slots button:hover { border-color: var(--accent); background: var(--peach-soft); }
.slots b { font-size: 16px; font-variant-numeric: tabular-nums; }
.slots small { font-size: 11.5px; color: var(--muted); }
.slots .lmx { font-size: 11px; font-weight: 700; color: var(--good); }
.or { font-family: var(--f-ui); font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 10px; margin: 20px 0 12px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.ok-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--good-bg); color: var(--good); font-family: var(--f-ui); font-weight: 650; font-size: 14px; padding: 6px 12px; border-radius: 999px; }
.mail { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; background: var(--bg); font-size: 17px; display: grid; gap: 8px; }
.mail .hdr { font-family: var(--f-ui); font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 8px; display: grid; gap: 2px; }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 0; }
.dl dt { color: var(--muted); } .dl dd { margin: 0; min-width: 0; }
.sms { white-space: pre-line; max-width: 320px; background: var(--good-bg); border-radius: 18px 18px 18px 4px; padding: 10px 14px; font-family: var(--f-ui); font-size: 14.5px; line-height: 1.4; }
.old { text-decoration: line-through; opacity: .55; }

/* ---------- Ordinace: kostra ---------- */
.adm-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 12px 12px 11px; font-size: 14.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; flex: none; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--paper); flex: none; }
.me select { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 5px 8px; font-size: 13px; max-width: 190px; }
.page { display: grid; gap: 16px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.side { position: sticky; top: 12px; display: grid; gap: 12px; }

/* ---------- Kalendář ---------- */
.cal-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.cal-nav { display: flex; align-items: center; gap: 6px; min-width: 0; }
.cal-title { font-family: var(--f-d); font-weight: 500; font-size: 21px; margin-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-tools { display: flex; align-items: center; gap: 8px; }
.cal-sub { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.cal-sum { font-size: 13px; color: var(--muted); }
.cal-sum b { color: var(--text); font-weight: 650; }
.cal { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.cg-row { display: grid; grid-template-columns: 52px repeat(var(--cols), minmax(0, 1fr)); }
.cg-head { border-bottom: 1px solid var(--line); background: var(--paper); }
.cg-day { border: 0; border-left: 1px solid var(--line-2); background: none; cursor: pointer; padding: 10px 4px 9px; display: grid; justify-items: center; gap: 2px; color: var(--text); min-width: 0; }
.cg-day:hover { background: var(--soft); }
.cg-day .dw { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.cg-day .dd { font-size: 20px; font-weight: 600; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.cg-day.today .dd { background: var(--btn-bg); color: var(--btn-text); }
.cg-day.today .dw { color: var(--text); }
.cg-day .sh { display: flex; gap: 4px 8px; flex-wrap: wrap; justify-content: center; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cg-day .sh span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.cg-day .sh .dot { width: 7px; height: 7px; }
.cg-day.static { cursor: default; } .cg-day.static:hover { background: none; }
.cg-times { position: relative; }
.cg-times span { position: absolute; right: 8px; font-size: 11.5px; color: var(--muted); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.cg-col { position: relative; border-left: 1px solid var(--line-2); cursor: pointer; }
.cg-col .hl { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--line-2); }
.cg-col .hl.half { border-top-style: dashed; opacity: .7; }
.cg-closed { position: absolute; left: 0; right: 0; background: var(--closed); cursor: default; }
.cg-strip { position: absolute; left: 0; width: 3px; pointer-events: none; border-radius: 0 2px 2px 0; }
.cg-block { position: absolute; left: 6px; right: 5px; border-radius: 8px; background: var(--block); font-size: 12px; color: var(--muted); padding: 4px 8px; overflow: hidden; cursor: default; font-weight: 600; }
.cg-ev { position: absolute; left: 6px; right: 5px; border: 0; border-radius: 8px; padding: 4px 8px; text-align: left; overflow: hidden; cursor: pointer; color: var(--text); background: var(--c, var(--c8)); box-shadow: 0 0 0 1.5px var(--paper); display: flex; flex-direction: column; line-height: 1.25; }
.cg-ev:hover { box-shadow: 0 0 0 1.5px var(--paper), 0 4px 12px rgba(51, 38, 34, .18); z-index: 3; }
.cg-ev .t { font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; opacity: .72; white-space: nowrap; }
.cg-ev .n { font-size: 13.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cg-ev .s { font-size: 12px; opacity: .78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cg-ev.compact { flex-direction: row; align-items: center; gap: 6px; padding-top: 2px; padding-bottom: 2px; }
.cg-ev.sel { box-shadow: 0 0 0 2px var(--text); z-index: 3; }
.cg-ev.noshow { opacity: .6; } .cg-ev.noshow .n { text-decoration: line-through; }
.cg-ev .web { position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.cg-ev.other { background: var(--block); color: var(--muted); cursor: default; }
.cg-ev.ghost { background: transparent; border: 2px dashed var(--text); box-shadow: none; pointer-events: none; }
.cg-ev.dragging { opacity: .92; box-shadow: 0 10px 24px rgba(0,0,0,.22); z-index: 6; cursor: grabbing; }
.cg-ev.dragging.bad { box-shadow: 0 0 0 2px var(--bad); }

    if (a.delblk) { S.blocks = S.blocks.filter(function (k) { return k.id !== +a.delblk; }); save(); toast('Blokace smazána'); return render(); }
    if (a.addstaff !== undefined) { S.staff.push({ id: 'h' + (++S.seq), name: 'Nová hygienistka', short: 'NH', role: 'staff', login: '', share: 70, color: 'st2' }); save(); toast('Účet přidán. Doplňte jméno a přidělte směny.'); return render(); }
    if (a.svcol) { var pc = a.svcol.split(':'); S.services[+pc[0]].color = pc[1]; save(); toast('Barva uložena'); return render(); }
    if (a.smspreset) { S.msg.sms = a.smspreset === 'rich' ? SMS_RICH : SMS_SHORT; S.msg.smsUni = a.smspreset === 'rich'; save(); toast('Předloha SMS nastavena'); return render(); }
  });

  function savePick() {
    var pk = ui.pick, cur = assignee(pk.date, pk.part), to = ui.pickTo === undefined ? cur : ui.pickTo, dow = parse(pk.date).getDay();
    var lost = cur && to !== cur ? partBookings(pk.date, pk.part, cur).length : 0;
    S.shifts = S.shifts.filter(function (z) { return !(z.date === pk.date && z.part === pk.part); });
    if (ui.pickScope === 'week') { S.roster[dow] = S.roster[dow] || { am: '', pm: '' }; S.roster[dow][pk.part] = to; }
    else if (to !== regular(pk.date, pk.part)) S.shifts.push({ id: ++S.seq, date: pk.date, part: pk.part, staff: to, note: '' });
    save(); ui.pick = null; ui.pickTo = undefined; render();
    toast((to ? PARTS[pk.part] + ' směnu má ' + staffName(to) : PARTS[pk.part] + ' směna: zavřeno') + (ui.pickScope === 'week' ? ' (každý týden)' : '') + (lost ? '. Pozor: ' + lost + ' ' + plural(lost, 'pacient', 'pacienti', 'pacientů') + ' k přesunutí.' : ''));
  }
  function saveNew() {
    var n = ui.newB; ui.err = '';
    if (!n.name || !n.name.trim()) ui.err = 'Doplňte jméno pacienta.';
    else if (digits(n.phone).length < 9) ui.err = 'Doplňte telefon (aspoň 9 číslic).';
    else if (n.start == null) ui.err = 'Vyberte čas.';
    else if (slots(n.date, svc(n.svc).dur, null, n.staff).indexOf(n.start) < 0) ui.err = 'Tento čas už není volný.';
    if (ui.err) return render();
    var s = svc(n.svc), nb = newBooking({ staff: n.staff, date: n.date, start: n.start, dur: s.dur, svc: n.svc, name: n.name.trim(), phone: n.phone, email: n.email || '', note: '', inote: n.inote || '', status: 'ok', src: 'admin', price: s.price, disc: 0, log: [], vok: '' });
    logIt(nb, 'Zadáno v ordinaci'); save();
    closePanel(); ui.sel = nb.id; ui.cur = nb.date; render();
    toast('Objednáno: ' + nb.name + ', ' + dShort(nb.date) + ' ' + hm(nb.start) + (nb.email ? '. Pacient dostane potvrzení.' : ''));
  }

  app.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, fd = {}; [].forEach.call(f.elements, function (el) { if (el.name) fd[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim(); });
    if (f.id === 'pf') {
      ui.form = fd; ui.err = '';
      if (fd.name.split(/\s+/).length < 2) ui.err = 'Napište prosím jméno i příjmení.';
      else if (digits(fd.phone).length < 9) ui.err = 'Telefon musí mít aspoň 9 číslic.';
      else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(fd.email)) ui.err = 'Zkontrolujte prosím e-mail, potvrzení přijde právě na něj.';
      else if (!fd.ok) ui.err = 'Pro dokončení je potřeba potvrdit storno podmínky.';
      else if (slots(ui.date, svc(ui.svc).dur, null, ui.tstaff).indexOf(ui.time) < 0) { ui.err = 'Tento čas si mezitím někdo zarezervoval. Vyberte prosím jiný.'; ui.step = 2; }
      if (ui.err) return render();
      var pct0 = lmPct(ui.date, ui.time), sv0 = svc(ui.svc);
      var b = newBooking({ staff: ui.tstaff, date: ui.date, start: ui.time, dur: sv0.dur, svc: ui.svc, name: fd.name, phone: fd.phone, email: fd.email, note: fd.note, inote: '', status: 'ok', src: 'web', price: discounted(sv0.price, pct0), disc: pct0, log: [], vok: '' });
      logIt(b, 'Rezervace přes web' + (pct0 ? ' (sleva last minute ' + pct0 + ' %)' : '')); save();
      ui.last = b.id; ui.step = 4; ui.form = {}; render(); window.scrollTo(0, 0); return;
    }
    if (f.id === 'mf') {
      var mb = byId(S.bookings, ui.sel), m = ui.mv; if (!mb || !m || m.start == null) return;
      var from = dShort(mb.date) + ' ' + hm(mb.start), ns = svc(m.svc);
      if (slots(m.date, ns.dur, mb.id, m.staff).indexOf(m.start) < 0) { toast('Tento čas už není volný'); return render(); }
      snap(mb);
      if (m.svc !== mb.svc) { mb.price = ns.price; mb.disc = 0; }
      var handed = m.staff !== mb.staff, fromStaff = staffName(mb.staff);
      mb.date = m.date; mb.start = m.start; mb.svc = m.svc; mb.dur = ns.dur; mb.staff = m.staff;
      logIt(mb, 'Přesunuto z ' + from + ' na ' + dShort(mb.date) + ' ' + hm(mb.start) + (handed ? ', předáno od ' + fromStaff + ' k ' + staffName(mb.staff) : '') + (fd.notify ? ', pacient informován' : ''));
      ui.mv = null; ui.moveOpen = false; ui.cur = mb.date; save(); render();
      return toast('Přesunuto na ' + dShort(mb.date) + ' ' + hm(mb.start) + (fd.notify && mb.email ? '. Pacient dostane zprávu.' : ''), true);
    }
    if (f.id === 'vf') {
      var vb = byId(S.bookings, ui.sel); if (!vb) return;
      var vv = fd.vok === vocative(vb.name) ? '' : fd.vok;
      S.bookings.forEach(function (x) { if (digits(x.phone) === digits(vb.phone)) x.vok = vv; });
      ui.moreOpen = true; save(); render(); return toast('Oslovení uloženo pro všechny termíny pacienta');
    }
    if (f.id === 'bf') {
      ui.err = '';
      var bfrom = fd.from, bto = fd.to || fd.from, s1 = fd.all ? 0 : hmToMin(fd.s), e1 = fd.all ? 1440 : hmToMin(fd.e);
      if (!bfrom || bto < bfrom) ui.err = 'Zkontrolujte data od–do.'; else if (!(e1 > s1)) ui.err = 'Konec musí být po začátku.';
      if (ui.err) return render();
      var clash = 0;
      for (var d = parse(bfrom); iso(d) <= bto; d = addDays(d, 1)) {
        var ds = iso(d); if (!openIntervals(ds, fd.who).length) continue;
        S.blocks.push({ id: ++S.seq, date: ds, start: s1, end: e1, reason: fd.r || 'Blokace', staff: fd.who || '' });
        S.bookings.forEach(function (b) { if (b.date === ds && b.status === 'ok' && (!fd.who || b.staff === fd.who) && b.start < e1 && b.start + b.dur > s1) clash++; });
      }
      save(); render(); toast(clash ? 'Přidáno. Pozor: v blokovaném čase je objednáno ' + clash + ' pacientů.' : 'Přidáno');
    }
  });

  app.addEventListener('change', function (e) {
    var t = e.target, d = t.dataset;
    if (t.id === 'as-user') { ui.user = t.value; closePanel(); ui.filter = ''; try { sessionStorage.setItem('rez2_user', t.value); } catch (x) {} render(); return toast('Přihlášena ' + me().name); }
    if (t.id === 'n-svc' || t.id === 'n-staff') { ui.newB[t.id === 'n-svc' ? 'svc' : 'staff'] = t.value; ui.newB.want = ui.newB.start || 0; return render(); }
    if (d.ndatein !== undefined && t.value) { ui.newB.date = t.value; return render(); }
    if (d.mdatein !== undefined && t.value) { ui.mv.date = t.value; ui.mv.drag = false; return render(); }
    if (t.id === 'm-svc' || t.id === 'm-staff') { ui.mv[t.id === 'm-svc' ? 'svc' : 'staff'] = t.value; ui.mv.drag = false; return render(); }
    if (t.id === 'm-notify') { ui.mv.notify = t.checked; return; }
    if (t.id === 's-h') { S.horizonMonths = +t.value; save(); return toast('Uloženo'); }
    if (t.id === 's-st') { S.step = +t.value; save(); return toast('Uloženo'); }
    if (t.id === 'lm-on') { S.lm.on = t.checked; save(); return toast('Uloženo'); }
    if (t.id === 'lm-pct') { S.lm.pct = +t.value; save(); return toast('Uloženo'); }
    if (t.id === 'lm-h') { S.lm.hours = +t.value; save(); return toast('Uloženo'); }
    if (t.id === 'msg-sms-on') { S.msg.smsOn = t.checked; save(); render(); return toast('Uloženo'); }
    if (t.id === 'msg-uni') { S.msg.smsUni = t.checked; save(); render(); return toast('Uloženo'); }
    if (d.msg) { if (d.msg === 'info') S.msg.info[d.svcid] = t.value; else S.msg[d.msg] = t.value; save(); return toast('Uloženo'); }
    if (d.st !== undefined) { var so = S.staff[+d.st]; so[d.f] = d.f === 'share' ? Math.max(0, Math.min(100, +t.value || 0)) : t.value; save(); return toast('Uloženo'); }
    if (d.sv !== undefined) {
      var s = S.services[+d.sv];
      if (d.f === 'online') s.online = t.checked; else if (d.f === 'name') s.name = t.value; else if (+t.value > 0 || (d.f === 'price' && t.value !== '')) s[d.f] = +t.value;
      save(); return toast('Uloženo');
    }
    if (d.sd !== undefined) {
      var sd = d.sd.split(':'), dw = +sd[0], f = sd[1], def = S.shiftDef[dw];
      if (f === 'open') {
        if (t.checked) { S.shiftDef[dw] = { am: [420, 780], pm: [780, 1080] }; S.roster[dw] = S.roster[dw] || { am: '', pm: '' }; }
        else S.shiftDef[dw] = null;
        save(); render(); return toast(t.checked ? 'Otevřeno – přidělte směny v tabulce nahoře' : 'Uloženo – v tento den zavřeno');
      }
      if (!def) return;
      var v = hmToMin(t.value); if (isNaN(v)) return;
      var st = def.am[0], spl = def.am[1], en = def.pm ? def.pm[1] : def.am[1];
      if (f === 'start') st = v; if (f === 'split') spl = v; if (f === 'end') en = v;
      if (!(st < spl && spl <= en)) { render(); return toast('Začátek musí být před předávkou a předávka nejpozději na konci'); }
      S.shiftDef[dw] = { am: [st, spl], pm: spl < en ? [spl, en] : null };
      save(); render(); return toast('Časy směn uloženy');
    }
  });

  var noteT;
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'i-note') {
      clearTimeout(noteT); var st = document.getElementById('note-state'); if (st) st.textContent = 'Ukládám…';
      noteT = setTimeout(function () { var ib = byId(S.bookings, ui.sel); if (!ib) return; ib.inote = t.value; save(); var st2 = document.getElementById('note-state'); if (st2) st2.textContent = 'Uloženo ✓'; }, 600);
      return;
    }
    if (t.id === 'n-q') { ui.newB.q = t.value; document.getElementById('n-sug').innerHTML = sugHtml(t.value); return; }
    if (t.dataset.nb && ui.newB) { ui.newB[t.dataset.nb] = t.value; return; }
    if (t.id === 'voc-test') { document.getElementById('voc-out').textContent = vocative(t.value) || '…'; return; }
    if (t.dataset.msg === 'sms') {
      var out = document.getElementById('sms-count'), pv = document.getElementById('sms-prev');
      if (out) out.textContent = smsCountText(smsParts(t.value)); if (pv) pv.textContent = smsText(t.value, SAMPLE); return;
    }
    if (t.id === 'q') { ui.q = t.value; var pos = t.selectionStart; render(); var q = document.getElementById('q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) {} }
  });
  app.addEventListener('toggle', function (e) { if (e.target.classList && e.target.classList.contains('more')) ui.moreOpen = e.target.open; }, true);

  /* ----- Nápověda pod myší a přetahování ----- */
  var hov = null, drag = null;
  app.addEventListener('mousemove', function (e) {
    if (drag && drag.moving) return;
    var tg = e.target, c = tg.classList && (tg.classList.contains('cg-col') || tg.classList.contains('hl') || tg.classList.contains('cg-strip')) ? tg.closest('.cg-col') : null;
    if (!c) { if (hov) hov.hidden = true; return; }
    if (!hov || !document.contains(hov)) { hov = document.createElement('div'); hov.className = 'cg-hov'; }
    if (hov.parentNode !== c) c.appendChild(hov);
    var r = c.getBoundingClientRect(), mins = G.GS + Math.floor((e.clientY - r.top) / G.PX / 15) * 15;
    hov.style.top = ((mins - G.GS) * G.PX + 1) + 'px'; hov.style.height = Math.max(22, 30 * G.PX - 2) + 'px'; hov.textContent = '+ ' + hm(mins); hov.hidden = false;
  });
  app.addEventListener('mouseleave', function () { if (hov) hov.hidden = true; });
  app.addEventListener('pointerdown', function (e) {
    var el = e.target.closest('.cg-ev[data-bk]'); if (!el || e.button !== 0 || e.pointerType === 'touch') return;
    var b = byId(S.bookings, +el.dataset.bk); if (!b) return;
    drag = { b: b, el: el, x0: e.clientX, y0: e.clientY, offY: e.clientY - el.getBoundingClientRect().top, moving: false, to: null };
  });
  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (!drag.moving && Math.abs(e.clientX - drag.x0) + Math.abs(e.clientY - drag.y0) < 6) return;
    drag.moving = true; drag.el.classList.add('dragging'); drag.el.style.pointerEvents = 'none'; if (hov) hov.hidden = true;
    var under = document.elementFromPoint(e.clientX, e.clientY), c = under && under.closest('.cg-col'); if (!c) return;
    if (drag.el.parentNode !== c) c.appendChild(drag.el);
    var r = c.getBoundingClientRect(), b = drag.b, mins = G.GS + Math.round((e.clientY - r.top - drag.offY) / G.PX / S.step) * S.step;
    mins = Math.max(G.GS, Math.min(G.GE - b.dur, mins));
    var ok = slots(c.dataset.col, b.dur, b.id, b.staff).indexOf(mins) > -1;
    drag.to = ok ? { date: c.dataset.col, start: mins } : null;
    drag.el.style.top = ((mins - G.GS) * G.PX + 1) + 'px'; drag.el.classList.toggle('bad', !ok);
    var tl = drag.el.querySelector('.t'); if (tl) tl.textContent = hm(mins) + '–' + hm(mins + b.dur);
  });
  window.addEventListener('pointerup', function () {
    if (!drag) return;
    var d = drag; drag = null; if (!d.moving) return;
    suppressClick = true; setTimeout(function () { suppressClick = false; }, 0);
    ui.newB = null; ui.sel = d.b.id;
    if (d.to && (d.to.date !== d.b.date || d.to.start !== d.b.start)) { ui.moveOpen = true; ui.mv = { id: d.b.id, date: d.to.date, start: d.to.start, svc: d.b.svc, staff: d.b.staff, notify: true, drag: true }; }
    else { ui.mv = null; if (!d.to) toast('Tam termín přesunout nejde – čas je obsazený nebo zavřeno'); }
    render();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || ui.view !== 'adm' || !(ui.sel || ui.newB || ui.pick)) return;
    closePanel(); render();
  });
  var lastMob = isMobile(), rT;
  window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(function () { if (isMobile() !== lastMob) { lastMob = isMobile(); render(); } }, 150); });

  render();
})();
</script>
